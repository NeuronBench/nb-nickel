[package]
name = "nb-nickel"
version = "0.1.0"
edition = "2021"
description = "Nickel evaluation for NeuronBench scenes: import linking without a filesystem, structured diagnostics, and slider parameter discovery."
repository = "https://github.com/neuronbench/nb-nickel"

[dependencies]
nickel-lang-core = { version = "0.18", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
